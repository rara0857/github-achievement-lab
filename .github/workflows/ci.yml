name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate tracker
        run: python scripts/validate_tracker.py
      - name: Print progress summary
        run: python scripts/validate_tracker.py --summary
      - name: Export progress JSON
        run: python scripts/validate_tracker.py --json
      - name: Run tests
        run: python -m unittest discover -s tests -v
